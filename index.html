: sentadilla 3×3 pesada (RIR 2–3) · sled push 2×50 m a 152 kg. NO llegar al fallo: el sábado hay simulacro.", "cal. 15' + 4×1 km Z4 (rec 60'') + 4×400 m Z5 (rec 60''). Moderar: el sábado es el simulacro.", "PULL ligero (25'): dominadas 2×4 · remo 2×8 · curl martillo 2×10 (RIR 3–4).", "60': 100 wall balls en series planificadas (p. ej. 25-25-25-25) + BBJ 80 m, con cronómetro.", "PUSH ligero (35'): press de pecho 2×5 · militar 2×5 · elev. laterales 2×15 (RIR 3–4). El sábado hay simulacro.", "Descanso total: mañana es el simulacro. Carbohidratos, hidratación y sueño.", "SIMULACRO COMPLETO (sáb 20-feb) a pesos Open: 8×(1 km + estación). Km a ritmo objetivo; SkiErg y remo controlados; wall balls en series planeadas. Anota los 16 splits y qué estación te rompió. Sin todo el material: bloques 1–4 y 5–8 con 10' de pausa.", "TIRADA LARGA 70' Z2."]}, {"n": 21, "ph": "3 · Específica", "f": "Recuperar del simulacro + afinar.", "h": 7, "d": ["MANTENIMIENTO (50'): sentadilla 3×4 · sled push 3×50 m a 152 kg · zancada con saco 2×50 m.", "RITMO HYROX: cal. 15' + 6×1 km a ritmo objetivo (rec 45'') + enfr. 10'.", "PULL mantenimiento (30'): dominadas lastradas 3×5 (RIR 2–3) · remo 2×8 · face pulls 2×15 · curl bíceps 2×10 · curl martillo 1–2×10 · farmers 3×100 m (2×24 kg).", "60': sled push + sled pull a peso de carrera, 2 rondas · farmers 2×100 m a 2×24 kg.", "PUSH mantenimiento (40'): press de pecho 3×5 (RIR 2–3) · inclinado 2×8 · militar 2×6 · elev. laterales 2×15 · tríceps en polea 2×12.", "Descanso. Opcional: 20–30' de paseo o movilidad (cadera, tobillo, dorsal).", "HALF-SIM 5–8 (70'): remo 1000 + farmers 200 + zancadas 100 + wall balls 100 con 1 km a ritmo objetivo entre cada una (al 80% de carga).", "TIRADA LARGA 65' Z2."]}, {"n": 22, "ph": "3 · Específica", "f": "Último golpe específico; a partir de aquí, bajar.", "h": 7, "d": ["MANTENIMIENTO (45'): sentadilla 2×4 pesada · sled push 2×50 m a 152 kg · core · movilidad.", "cal. 15' + 4×1 km a ritmo objetivo (rec 60'') + enfr. 10'. Fino y controlado.", "PULL ligero (25'): dominadas 2×4 · remo 2×8 · curl martillo 2×10 (RIR 3–4).", "50': wall balls 3×25 + BBJ 2×20 m + remo 500 m a ritmo de carrera. Corto y fino.", "PUSH mantenimiento (40'): press de pecho 3×5 (RIR 2–3) · inclinado 2×8 · militar 2×6 · elev. laterales 2×15 · tríceps en polea 2×12.", "Descanso. Opcional: 20–30' de paseo o movilidad (cadera, tobillo, dorsal).", "ÚLTIMO ESPECÍFICO (sáb 6-mar, 60'): 4×(1 km ritmo objetivo + estación) con SkiErg, sled push, BBJ y 100 wall balls a peso de carrera.", "TIRADA LARGA 60' Z2."]}, {"n": 23, "ph": "4 · Taper", "f": "TAPER 1: -30% de volumen, la intensidad se mantiene.", "h": 4.75, "d": ["LIGERO (35'): sentadilla 2×5 al 70% · sled push 2×25 m ligero · activación de glúteo. Llega con las piernas frescas.", "TAPER: cal. 15' + 4×1 km a ritmo objetivo (rec 90'') + enfr. 10'. Termina con ganas de más.", "PULL ligero (25'): dominadas 2×4 (RIR 4) · curl martillo 2×10 · farmers 2×50 m. Fresco.", "40': wall balls 3×20 + BBJ 2×20 m + SkiErg 500 m a ritmo de carrera.", "PUSH ligero (30'): press de pecho 2×5 (RIR 4) · militar 2×5 · elev. laterales 2×12. Nada que te deje agujetas.", "Descanso. Opcional: 20–30' de paseo o movilidad (cadera, tobillo, dorsal).", "CORTO (35'): 2×(1 km ritmo objetivo + 25 wall balls + 20 m BBJ). Termina con ganas.", "RODAJE 45' Z1–Z2 suave."]}, {"n": 24, "ph": "4 · Taper", "f": "TAPER 2 + CARRERA el jueves 18-mar.", "h": 2, "d": ["ÚLTIMA CALIDAD (30'): 15' Z2 + 4×1' a ritmo objetivo (rec 90'') + 2×10 wall balls + 20 m burpee broad jumps. Termina fresco.", "Descanso o 20' Z1 + movilidad. Prepara bolsa, nutrición y logística; aprende de memoria el orden de las estaciones.", "—", "Activación (15–20'): 10' Z2 + 4 strides + 10 wall balls suaves + 1×20 m sled ligero. A dormir pronto.", "DÍA DE CARRERA — IFEMA Madrid (jueves 18-mar). Tu hora de salida es fija y no admite cambios; llega con margen para check-in. Km 1 en Z3 bajo, SkiErg controlado, y guarda gasolina para remo y wall balls.", "Recuperación post-carrera: paseo y comida buena. Revisa tus splits oficiales.", "Libre / recuperación. Nada duro.", "Libre: caminar y movilidad."]}], "G": [{"t": "Tu perfil", "h": ["Tema", "Cómo lo aplica el plan"], "r": [["Corredor fuerte", "5K 21:47, 10K 45:41, media 1:43:32 y 1 km en 3:30: el motor es tu ventaja. Los ritmos de las zonas ya están calculados con tu 5K. Falta velocidad sostenida con fatiga: 1 sesión de calidad por semana."], ["Tren superior fuerte", "Banca ~120 kg y dominadas con +20 kg × 8: mantienes tus 2 sesiones (Push y Pull) con ~40–60% menos volumen e intensidad similar. Ver hojas Musculos y Cargas."], ["Punto débil: piernas", "Sentadilla y peso muerto a 70 kg × 10 son bajos frente a tu pecho. Eso limitará sled push, zancadas y wall balls. Fuerza de piernas el lunes + accesorios el jueves en la base, con alternativas que no te obligan a forzar la espalda (prensa, goblet/frontal, RDL con mancuernas, hip thrust, búlgara)."], ["Primera Hyrox", "No tienes tiempos de estación: los tests de las semanas 1 (SkiErg/remo), 4 (wall balls) y 8 sirven de referencia. La hoja Objetivo_tiempo estima tu marca y se actualiza con tus datos."]]}, {"t": "Fases del plan", "h": ["Fase", "Semanas", "Desde", "Hasta", "Objetivo", "Claves"], "r": [["1 · Base", "1–8", "05/10/26", "29/11/26", "Base aeróbica + fuerza de piernas + técnica", "Aprender las estaciones, introducir 1 km repetidos y construir piernas. Tests en semanas 1 (SkiErg/remo), 4 (wall balls) y 8."], ["2 · Construcción", "9–16", "30/11/26", "24/01/27", "Capacidad: correr con fatiga y sled a peso de carrera", "Half-sims al 80–100%; umbral y VO2; sim al 70% en semana 15. Test en semana 16."], ["3 · Específica", "17–22", "25/01/27", "07/03/27", "Específica: ritmo objetivo y simulacros", "Semana 20: simulacro completo. Semana 22: último golpe específico."], ["4 · Taper", "23–24", "08/03/27", "21/03/27", "Taper y carrera", "Volumen -30% y luego -50%, intensidad corta a ritmo objetivo. Última sesión dura el sábado de la semana 22."]]}, {"t": "Semana tipo", "h": ["Día", "Sesión", "Para qué"], "r": [["Lunes", "Fuerza de piernas (+ sled desde sem. 9)", "Empuje en sled, zancadas y fuerza para correr con fatiga"], ["Martes", "Carrera de calidad (Z4/Z5/ritmo Hyrox) + PULL después", "Velocidad sostenida entre estaciones; espalda/bíceps el mismo día para dejar el viernes libre"], ["Miércoles", "Estaciones y técnica + Z2", "Wall balls, burpees y ergómetros, que son lo más rentable"], ["Jueves", "PUSH (pecho, hombro, tríceps)", "Conservar tu pecho y hombro sin comerte la recuperación"], ["Viernes", "Descanso o movilidad", "Asimilar"], ["Sábado", "Híbrido / simulacro", "Correr justo después de cada estación (lo que decide el tiempo)"], ["Domingo", "Tirada larga Z2 (por tiempo, tope 85')", "Base aeróbica con riesgo de lesión controlado"]]}, {"t": "Reglas del plan", "l": ["1. Máximo 2–3 sesiones intensas por semana (martes, sábado y a veces miércoles). El resto fácil de verdad: sin 'zona gris'.", "2. Sube el volumen de carrera como máximo ~10% por semana. Cada 4ª semana es de descarga.", "3. Si llegas al domingo con las piernas cargadas, cambia la tirada larga por 75' de bici estática en Z2.", "4. La semana 20 es el simulacro completo; las semanas 19 y 21 se ajustan para llegar fresco y recuperarte. No hay otro simulacro completo después.", "5. En el taper se baja el volumen y se mantiene algo de intensidad corta; no pruebes nada nuevo (comida, zapatillas, técnica).", "6. Duerme 7–9 h: es lo primero que se sacrifica y lo que más cuesta en rendimiento.", "7. Si no puedes hacer el Pull justo después de correr el martes, muévelo al viernes y hazlo ligero (RIR 3–4): el sábado hay sled pull, SkiErg y farmers."]}, {"t": "Guía de fuerza", "h": ["Tema", "Detalle"], "r": [["Cómo medir el esfuerzo", "RIR = repeticiones que te quedan en reserva. RIR 3 = podrías hacer 3 más. En esta fase usa RIR 2–3 casi siempre; el fallo no aporta y estropea la carrera del día siguiente."], ["Progresión base (sem. 1–8)", "Sentadilla trasera, RDL y búlgara. Sube 2,5–5 kg cuando completes todas las series con RIR ≥2. Si no, repite la carga."], ["Progresión construcción (sem. 9–16)", "La sentadilla se queda pesada pero con pocas series (mantener). El volumen se mueve a sled push, sled pull y zancadas con saco, que son lo que se mide en carrera."], ["Sled push (152 kg incluido el trineo)", "Tramos de 12,5 m con pausas muy cortas (no empujes 50 m seguidos). Empieza por debajo del peso de carrera (sem. 9–10) y llega al peso de carrera en la semana 11. No juzgues por el trineo de tu gimnasio: el de carrera es más duro."], ["Sled pull (103 kg incluido el trineo)", "Ritmo estable mano sobre mano. Es una estación de espalda, glúteo y femoral, así que tu base de tren superior ayuda."], ["Zancadas con saco (20 kg, 100 m)", "Mantente erguido entre pasos; se penaliza no estirar la cadera. Entrena series de 25 m en lugar de 100 m seguidos hasta la semana 14."], ["Tren superior (martes Pull / jueves Push)", "Mantienes tus dos sesiones habituales, con menos series y la misma intensidad (RIR 2). Los farmers van en el Pull para cuidar el agarre: soltarlos antes de tiempo o quedarte sin agarre en el sled pull hace perder tiempo."], ["Descargas", "Semanas 4, 8, 12, 16 y 19: el mismo patrón con ~40% menos carga y volumen."], ["Señales de alerta", "Dolor en rodilla, tendón de Aquiles o zona lumbar que persiste más de 3 días: baja carga/impacto (bici estática en vez de correr) y consulta con un fisio. En Hyrox la mayoría de las lesiones vienen de la sobrecarga por correr, así que el volumen de carrera se sube poco a poco."]]}, {"t": "Qué cubre Hyrox y qué añadir (músculos)", "h": ["Grupo muscular", "Qué lo trabaja en Hyrox", "Estímulo de Hyrox", "Qué meter tú después del entreno"], "r": [["Pecho", "Burpees (parte de flexión) y sled push, de forma ligera", "Bajo", "SÍ: press de pecho e inclinado (tu Push). Es el grupo que Hyrox casi no toca."], ["Hombro frontal", "Wall balls (100 lanzamientos), SkiErg y sled push", "Alto (resistencia)", "Puedes bajar el press militar a 2 series. Wall balls dan resistencia, no fuerza."], ["Hombro lateral", "Casi nada", "Bajo", "SÍ: elevaciones laterales 2–3 series (ya incluidas en el Push)."], ["Hombro posterior", "Remo y sled pull, algo", "Bajo-medio", "SÍ: pájaros o face pulls 2–3 series (incluidos en el Pull)."], ["Tríceps", "SkiErg, wall balls, burpees y sled push", "Alto (resistencia)", "Recorta: francés o polea, no los dos, desde la semana 9."], ["Dorsales (tirón vertical)", "SkiErg y sled pull", "Medio", "Mantén dominadas lastradas: es fuerza que Hyrox no te da."], ["Espalda media (tirón horizontal)", "Remo y sled pull", "Medio-alto", "Remo con pecho apoyado 2–3 series; no hace falta mucho más."], ["Bíceps", "Sled pull, remo y farmers (secundario)", "Medio", "Bajo a 2 series de curl; el martillo ayuda al agarre."], ["Antebrazo y agarre", "Farmers, sled pull y remo", "Alto", "Cubierto: farmers en el Pull."], ["Trapecio", "Farmers y sled pull", "Medio", "Cubierto."], ["Core", "Casi todas las estaciones", "Alto", "Cubierto; no hace falta extra más allá del trabajo de piernas."], ["Cuádriceps y glúteo", "Sled push, zancadas, wall balls y burpees", "Alto", "Fuerza de piernas el lunes; sin extra."], ["Isquios y glúteo (cadena posterior)", "Sled pull, zancadas, farmers", "Medio", "RDL y hip thrust del lunes."], ["Gemelos", "Sled push, carrera, zancadas", "Alto", "Cubierto por correr; 3×15 el lunes."]]}, {"t": "Series por fase (tu rutina)", "h": ["Ejercicio", "Base (sem. 1–8)", "Construcción (sem. 9–16)", "Específica (sem. 17–22)", "Taper (sem. 23–24)"], "r": [["PUSH · Press de pecho", "4×6", "3×6", "3×5 (RIR 2–3)", "2×5"], ["PUSH · Press inclinado", "3×8", "2×8", "2×8", "—"], ["PUSH · Press militar", "3×6", "2×6", "2×6", "2×5"], ["PUSH · Elev. laterales (nuevo)", "3×12–15", "3×12", "2×15", "2×12"], ["PUSH · Press francés", "3×10", "2×10", "—", "—"], ["PUSH · Tríceps en polea", "2×12", "—", "2×12", "—"], ["PULL · Dominad function dat(){const l=D.L;let h=`<h1>Datos</h1><div class="card"><b>Registro de tests</b><div class="mu">Anota tus resultados; se guardan en este dispositivo.</div>`+D.T.map((r,i)=>`<div style="margin-top:10px"><span class="mu">Sem. ${r[0]} · ${r[1]}</span><br>${r[2]}<input class="w" data-ts="${i}" value="${tst[i]||""}" placeholder="Resultado"></div>`).join("")+`</div>
 <div class="card"><b>Cargas de trabajo</b><div class="mu">e1RM = peso × (1 + reps/30). Cambia peso y reps con tus marcas.</div><div class="sc"><table><tr><th>Ejercicio</th><th>kg</th><th>reps</th><th>e1RM</th><th>Base</th><th>Constr.</th><th>Espec.</th></tr>`+
 l.map((r,i)=>{const v=lf[i]||[r[1],r[2]],e=v[1]==1?v[0]:v[0]*(1+v[1]/30),q=p=>(Math.round(e*p/r[6])*r[6]).toFixed(1).replace(".0","");return`<tr><td>${r[0]}</td><td><input data-lf="${i}" data-j="0" value="${v[0]}" style="width:56px"></td><td><input data-lf="${i}" data-j="1" value="${v[1]}" style="width:44px"></td><td>${e.toFixed(0)}</td><td>${q(r[3])}</td><td>${q(r[4])}</td><td>${q(r[5])}</td></tr>`}).join("")+`</table></div></div>
 ${ghc()}<div class="card"><b>Copia de seguridad</b><div class="mu">Para pasar tu progreso a otro dispositivo: copia este texto y pégalo allí.</div><textarea id="bk" readonly>${JSON.stringify(["hx-done","hx-cfg","hx-tests","hx-lifts","hx-notes","hx-chk"].reduce((a,k)=>(a[k]=ld(k),a),{}))}</textarea><div class="row" style="margin-top:8px"><button id="bi">Importar texto pegado</button></div></div>`;return h}
const EX=[["Si me salto días",`<ul><li>1–2 sesiones: sigue con el plan, sin recuperarlas ni hacer dos seguidas.</li><li>3–7 días: repite la última semana completa que hiciste.</li><li>Más de una semana: vuelve con la primera semana al ~70% de volumen, sin fallo.</li><li>Últimas 6 semanas: recorta la fase anterior, nunca el taper.</li><li>Prioridad: sábado > martes (carrera) > domingo > miércoles > lunes > Push > Pull.</li></ul>`],
["Calentamientos",`<ul><li>Carrera: 10' Z1–Z2 + movilidad de cadera y tobillo + 4 strides.</li><li>Fuerza: 5' bici o remo suave + movilidad + 2 series ligeras del primer ejercicio.</li><li>Estaciones: 5' ergómetro Z1–Z2 + 10 wall balls ligeros + 5 burpee broad jumps.</li></ul>`],
["Nutrición y suplementos",`<ul><li>1–3 h antes de sesiones clave: carbohidratos fáciles + algo de proteína.</li><li>Tirada larga >75', simulacro y carrera: 30–60 g de carbohidratos por hora y sodio.</li><li>Después: 20–40 g de proteína + carbohidratos en las 2 h siguientes.</li><li>Diario: 1,6–2 g de proteína/kg y 7–9 h de sueño.</li><li>Creatina 3–5 g/día; cafeína 3–6 mg/kg 45–60' antes, probada antes en entrenos.</li><li>Nada nuevo en semana de carrera. Si tomas medicación, consulta a tu médico.</li></ul>`],
["Glosario",`<ul><li><b>RIR</b>: repeticiones que te quedan en reserva. RIR 2 = podrías hacer 2 más.</li><li><b>Z1–Z5</b>: zonas de intensidad (ver pestaña Zonas).</li><li><b>'</b> = minutos, <b>''</b> = segundos. <b>rec</b> = descanso, <b>cal.</b> = calentamiento, <b>enfr.</b> = enfriamiento.</li><li><b>BBJ</b>: burpee broad jumps. <b>Roxzone</b>: zona de transición entre estaciones.</li><li><b>Strides</b>: 20'' de aceleración progresiva con descanso de 60''.</li><li><b>Descarga</b>: semana con ~40% menos volumen.</li></ul>`]];
const CK={"Material":["Zapatillas ya rodadas","Ropa adecuada al tiempo","Bolsa con cambio y toalla","Geles o bebida isotónica probados"],"Logística":["Confirmar hora de salida y check-in","Dorsal y documentación de inscripción","Ruta a IFEMA (metro o coche)","Desayuno 2,5–3 h antes","Dormir bien las 2 noches previas"],"Estrategia":["Orden de estaciones memorizado","Km 1 a ritmo objetivo +5–10''","SkiErg controlado","Wall balls en series planificadas","Roxzone sin pausas"]};
function gui(){let h=`<h1>Guía</h1>`;D.G.forEach(g=>{h+=`<div class="card"><details open><summary>${g.t}</summary>`+(g.l?`<ul>${g.l.map(x=>`<li>${x}</li>`).join("")}</ul>`:tb(g.h,g.r))+(g.n?`<p class="mu">${g.n}</p>`:"")+`</details></div>`});
 EX.forEach(e=>h+=`<div class="card"><details><summary>${e[0]}</summary>${e[1]}</details></div>`);
 h+=`<div class="card"><details><summary>Checklist de carrera</summary>`+Object.keys(CK).map(k=>`<b>${k}</b>`+CK[k].map(x=>`<div><label><input type="checkbox" data-ck="${x}" ${ck[x]?"checked":""} style="width:auto"> ${x}</label></div>`).join("")).join("")+`</details></div>`;return h}
let tmI,tmE=0;
function tick(){const e=document.getElementById("tm"),r=Math.ceil((tmE-Date.now())/1e3);if(r<=0){clearInterval(tmI);e.hidden=true;navigator.vibrate&&navigator.vibrate([300,150,300]);return}e.hidden=false;e.textContent="⏱ "+Math.floor(r/60)+":"+pad(r%60)+" · toca para parar"}
function R(){const m=document.getElementById("m"),q=i=>document.getElementById(i);m.innerHTML={h:hoy,c:cal,z:zon,d:dat,g:gui}[tab]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("a",b.dataset.t==tab));
 m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;done[k]=done[k]==v?0:v;sv("hx-done",done);R()});
 m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{sel=+b.dataset.o;tab="h";R();scrollTo(0,0)});
 m.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{clearInterval(tmI);tmE=Date.now()+b.dataset.tm*1e3;tmI=setInterval(tick,250);tick()});
 m.querySelectorAll("[data-ts]").forEach(i=>i.onchange=()=>{tst[i.dataset.ts]=i.value;sv("hx-tests",tst)});
 m.querySelectorAll("[data-lf]").forEach(i=>i.onchange=()=>{const k=i.dataset.lf,v=lf[k]||[D.L[k][1],D.L[k][2]];v[+i.dataset.j]=+i.value;lf[k]=v;sv("hx-lifts",lf);R()});
 m.querySelectorAll("[data-ck]").forEach(i=>i.onchange=()=>{ck[i.dataset.ck]=i.checked;sv("hx-chk",ck)});
 if(q("pv"))q("pv").onclick=()=>{sel=cl(sel-1);R()};if(q("nx"))q("nx").onclick=()=>{sel=cl(sel+1);R()};if(q("hy"))q("hy").onclick=()=>{sel=cl(off(new Date()));R()};
 if(q("nt"))q("nt").onchange=()=>{nt[sel]=q("nt").value;sv("hx-notes",nt)};
 if(q("gc"))q("gc").onclick=async()=>{const t=q("gt").value.trim();if(!t)return;setSy("⏳ Conectando…");try{await connect(t);R()}catch(e){gh=null;setSy("");alert("No se pudo conectar. Revisa que el token sea clásico y tenga el permiso gist.")}};if(q("gd"))q("gd").onclick=()=>{localStorage.removeItem("hx-gh");gh=null;setSy("");R()};if(q("bi"))q("bi").onclick=()=>{const t=prompt("Pega aquí el texto de la copia de seguridad");if(!t)return;try{const o=JSON.parse(t);Object.keys(o).forEach(k=>o[k]&&sv(k,o[k]));location.reload()}catch(e){alert("Texto no válido")}};
 if(tab=="z"){const u=()=>{cfg={m:+q("m5").value||0,s:+q("s5").value||0,hr:+q("hr").value||190};sv("hx-cfg",cfg);R()};["m5","s5","hr"].forEach(i=>q(i).onchange=u)}}
document.getElementById("tm").onclick=()=>{clearInterval(tmI);document.getElementById("tm").hidden=true};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;R();if(tab=="c"){const e=document.getElementById("w"+Math.floor(cl(off(new Date()))/7));e&&e.scrollIntoView()}else scrollTo(0,0)});
R();

const KEYS=["hx-done","hx-cfg","hx-tests","hx-lifts","hx-notes","hx-chk"],GF="hyrox-state.json",GD="hyrox-plan-state";
let gh=ld("hx-gh"),pt=null;
const setSy=x=>{const e=document.getElementById("sy");if(e)e.textContent=x};
function touch(){try{localStorage.setItem("hx-ts",String(Date.now()))}catch(e){}if(gh&&gh.id){clearTimeout(pt);setSy("⏳ Guardando…");pt=setTimeout(push,1500)}}
const snap=()=>{const o={ts:+localStorage.getItem("hx-ts")||0};KEYS.forEach(k=>o[k]=ld(k));return o};
const api=(p,m,b)=>fetch("https://api.github.com"+p,{method:m||"GET",headers:{Authorization:"Bearer "+gh.t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
async function push(){try{await api("/gists/"+gh.id,"PATCH",{files:{[GF]:{content:JSON.stringify(snap())}}});setSy("☁️ Sincronizado")}catch(e){setSy("⚠️ Error de sincronización")}}
async function pull(){try{const g=await api("/gists/"+gh.id),f=g.files[GF];let rm={};if(f)rm=JSON.parse(f.truncated?await(await fetch(f.raw_url)).text():f.content||"{}");const lt=+localStorage.getItem("hx-ts")||0;
 if((rm.ts||0)>lt){KEYS.forEach(k=>rm[k]!=null&&localStorage.setItem(k,JSON.stringify(rm[k])));localStorage.setItem("hx-ts",String(rm.ts));location.reload()}else if(lt>(rm.ts||0))await push();else setSy("☁️ Sincronizado")}catch(e){setSy("⚠️ Error de sincronización")}}
async function connect(t){gh={t};const l=await api("/gists?per_page=100");let g=l.find(x=>x.description==GD);if(!g)g=await api("/gists","POST",{description:GD,public:false,files:{[GF]:{content:JSON.stringify(snap())}}});gh={t,id:g.id};localStorage.setItem("hx-gh",JSON.stringify(gh));await pull()}
function ghc(){return`<div class="card"><b>Sincronizar con GitHub</b><div class="mu">Guarda tu progreso en un gist privado de tu cuenta para compartirlo entre dispositivos.</div>`+(gh&&gh.id?`<p>✅ Conectado.</p><button id="gd">Desconectar este dispositivo</button>`:`<input class="w" id="gt" type="password" placeholder="Token de GitHub (clásico, permiso gist)" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="p" id="gc">Conectar</button></div>`)+`</div>`}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&gh&&gh.id)pull()});
if(gh&&gh.id)pull();
</script></body></html>
